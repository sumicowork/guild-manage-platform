name: Build and Deploy

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm run build

      # Archive .next for SCP transfer
      - run: tar -czf next.tar.gz .next

      # Deploy to server
      - name: Deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "next.tar.gz"
          target: "/opt/guild-manage-platform"

      - name: Restart
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            DIAG=/tmp/deploy_diag.log
            exec > $DIAG 2>&1
            set -x
            cd /opt/guild-manage-platform
            ls -la next.tar.gz
            rm -rf .next
            tar -xzf next.tar.gz
            ls .next/standalone/server.js || echo "STANDALONE MISSING"
            rm next.tar.gz
            # Stop PM2 app FIRST (kills parent), then kill orphaned worker processes.
            # Next spawns a separate worker that outlives the PM2 parent — killing by
            # exact cmdline pattern prevents EADDRINUSE on restart.
            # WARNING: this script's text becomes the bash -c cmdline; any occurrence of
            # the literal target word would make pkill -f match this shell itself.
            # NOTE: pm2 delete 必须在前（停掉 autorestart），否则 pkill 触发 PM2
            # 自动重启竞态 → 新孤儿继续占端口 → EADDRINUSE 无限循环（已实测验证）
            pm2 delete guild-platform 2>/dev/null || true
            pkill -9 -f "next-serve[r]" 2>/dev/null || true
            sleep 2
            # 端口释放确认：仍被占则按 PID 补杀（pkill 可能漏掉脱离进程树的孤儿）
            for i in 1 2 3; do
              ss -tlnp | grep -q ':3003' || break
              echo "PORT 3003 STILL BUSY (attempt $i), killing..."
              pkill -9 -f "next-serve[r]" 2>/dev/null || true
              sleep 2
            done
            ss -tlnp | grep 3003 && echo "!! PORT STILL BUSY" || echo "PORT FREE"
            # Standalone single-process server (no worker fork → no orphans)
            # Copy public + static assets that standalone does not bundle
            cp -r public .next/standalone/public 2>/dev/null || true
            mkdir -p .next/standalone/.next
            cp -r .next/static .next/standalone/.next/static 2>/dev/null || true
            # standalone does not auto-load .env — export it for the PM2 child
            set -a; . ./.env 2>/dev/null || true; set +a
            pm2 start ecosystem.config.js
            sleep 5
            pm2 list | grep guild-platform || echo "PM2 LIST EMPTY"
            pm2 save
