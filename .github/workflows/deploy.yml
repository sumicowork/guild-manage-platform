name: Build and Deploy

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm run build

      # Archive .next for SCP transfer
      - run: tar -czf next.tar.gz .next

      # Deploy to server
      - name: Deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "next.tar.gz"
          target: "/opt/guild-manage-platform"

      - name: Restart
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/guild-manage-platform
            rm -rf .next
            tar -xzf next.tar.gz
            rm next.tar.gz
            # Kill any orphaned next-server NOT managed by PM2 (zombie prevention)
            pkill -f "^next-server " 2>/dev/null || true
            sleep 2
            # Delete + recreate to ensure clean slate (avoids stale PM2 state)
            pm2 delete guild-platform 2>/dev/null || true
            pm2 start ./node_modules/.bin/next --name guild-platform -- start -p 3003
            pm2 save
