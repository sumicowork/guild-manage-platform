name: Build and Deploy

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm run build

      # Archive .next for SCP transfer
      - run: tar -czf next.tar.gz .next

      # Deploy to server
      - name: Deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "next.tar.gz"
          target: "/opt/guild-manage-platform"

      - name: Restart
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/guild-manage-platform
            rm -rf .next
            tar -xzf next.tar.gz
            rm next.tar.gz
            # Stop PM2 app FIRST (kills parent), then kill orphaned next-server workers
            # Next.js spawns a separate next-server worker that outlives the PM2 parent —
            # killing by exact cmdline pattern prevents EADDRINUSE on restart
            pm2 delete guild-platform 2>/dev/null || true
            pkill -9 -f "next-server" 2>/dev/null || true
            sleep 2
            # Standalone single-process server (no worker fork → no orphans)
            # Copy public + static assets that standalone does not bundle
            cp -r public .next/standalone/public 2>/dev/null || true
            mkdir -p .next/standalone/.next
            cp -r .next/static .next/standalone/.next/static 2>/dev/null || true
            # standalone does not auto-load .env — export it for the PM2 child
            set -a; . ./.env 2>/dev/null || true; set +a
            pm2 start ./.next/standalone/server.js --name guild-platform
            pm2 save
